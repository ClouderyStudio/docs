name: Build Test

on:
  push:
    branches: [ "new" ]
  pull_request:
    branches: [ "new" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node 
      uses: actions/setup-node@v4
      with:
        node-version: 22.11.0
        cache: 'pnpm'
        cache-dependency-path: pnpm-lock.yaml
    - run: pnpm i
    - run: pnpm build --if-present
